name: Release

# Push a tag that matches the version in CMakeLists.txt, e.g. `git tag v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the project version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern '^\s+VERSION (\d+\.\d+\.\d+)' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match project version $version in CMakeLists.txt"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake --preset vs2022-x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -C Release

      - name: Check the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/WinXcode-*-win-x64.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $archive.Entries.FullName
          $archive.Dispose()
          $names
          foreach ($file in 'winx.exe', 'winxcode.exe', 'winx-ld64-shim.exe', 'LICENSE',
                            'README.md', 'vcruntime140.dll', 'msvcp140.dll') {
            if ($names -notcontains $file) { throw "$file is missing from $($zip.Name)" }
          }
          # Runs from the unpacked zip alone, so the bundled runtime is enough.
          Expand-Archive $zip.FullName -DestinationPath build/package-check -Force
          & build/package-check/winx.exe --version
          if ($LASTEXITCODE -ne 0) { throw "winx.exe --version exited with $LASTEXITCODE" }

      - name: Write Scoop and winget manifests
        run: >
          python packaging/make_manifests.py
          --version ${{ steps.version.outputs.version }}
          --zip build/WinXcode-${{ steps.version.outputs.version }}-win-x64.zip
          --out build/manifests

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path build/manifests/winget/* -DestinationPath build/winget-manifests-$version.zip
          gh release create "${{ github.ref_name }}" --title "WinXcode $version" --generate-notes `
            "build/WinXcode-$version-win-x64.zip" `
            build/manifests/winxcode.json `
            "build/winget-manifests-$version.zip"
